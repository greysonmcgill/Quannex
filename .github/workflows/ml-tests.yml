name: ML Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'quan/ml/**'
      - 'quan/mlops/**'
      - 'quan/intelligence/**'
      - 'tests/unit/test_*ml*.py'
      - 'tests/unit/test_*intelligence*.py'
      - '.github/workflows/ml-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'quan/ml/**'
      - 'quan/mlops/**'
      - 'quan/intelligence/**'
      - 'tests/unit/test_*ml*.py'
      - 'tests/unit/test_*intelligence*.py'
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: 'Run slow tests (memory, performance)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  COVERAGE_TARGET: 80

jobs:
  lint:
    name: Lint ML Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff
        run: ruff check quan/ml quan/mlops quan/intelligence

      - name: Run MyPy
        run: mypy quan/ml quan/mlops quan/intelligence --ignore-missing-imports
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -m "not slow and not memory and not thread_safety" \
            --cov=quan.ml \
            --cov=quan.intelligence \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_TARGET }} \
            --durations=10

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ml-unit-tests
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Integration Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -m "integration" \
            --durations=10

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install hypothesis

      - name: Run Property-Based Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -k "PropertyBased" \
            --hypothesis-show-statistics \
            --durations=10
        env:
          HYPOTHESIS_PROFILE: ci

  slow-tests:
    name: Slow Tests (Performance & Memory)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_slow_tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Performance Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -m "slow" \
            --durations=20

      - name: Run Memory Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -m "memory" \
            --durations=20

  thread-safety-tests:
    name: Thread Safety Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Thread Safety Tests
        run: |
          pytest quan/mlops/test_harness.py \
            -v \
            --tb=short \
            -m "thread_safety" \
            --durations=10

  test-harness-standalone:
    name: Test Harness Standalone
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install hypothesis

      - name: Run Test Harness
        run: |
          python -m quan.mlops.test_harness --verbose --ci

  all-tests-summary:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, property-tests, thread-safety-tests]
    if: always()
    steps:
      - name: Check Results
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.property-tests.result }}" == "failure" ]]; then
            echo "Property-based tests failed"
            exit 1
          fi
          if [[ "${{ needs.thread-safety-tests.result }}" == "failure" ]]; then
            echo "Thread safety tests failed"
            exit 1
          fi
          echo "All ML tests passed!"
