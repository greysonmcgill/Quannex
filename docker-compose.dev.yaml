# QUAN Recovery - Development Environment
# Minimal setup for local development using SQLite
# No external dependencies (no Kafka, Redis, PostgreSQL required)

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # Use SQLite for local dev (no PostgreSQL needed)
      - DATABASE_URL=sqlite:///./quan.db
      - SQL_DEBUG=false
    volumes:
      # Mount source code for hot reload
      - ./quan:/app/quan
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # Persist SQLite database
      - ./quan.db:/app/quan.db
    command: uvicorn quan.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      # Mount source for hot reload
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
    command: npm run dev
    depends_on:
      - api

# No external volumes needed - SQLite file is local
