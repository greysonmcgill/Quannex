# QUAN Collections ML Training Data Schema
# Generated by quan.mlops.data_contracts
# Version: 1.0.0

name: quan_collections
version: "1.0.0"
description: QUAN Collections ML Training Data Schema
owner: mlops-team
created_at: "2025-01-20T00:00:00"
updated_at: "2025-01-20T00:00:00"

# Primary keys for splitting and temporal ordering
entity_key: account_id
timestamp_key: snapshot_date

# Data quality thresholds
min_rows: 1000
max_null_ratio: 0.1

# Temporal boundaries (optional)
min_date: null
max_date: null

# ============================================================================
# Feature Definitions
# ============================================================================
features:
  # --- Identifiers (PII) ---
  - name: account_id
    dtype: categorical
    description: Unique account identifier
    nullable: false
    contains_pii: false

  - name: debtor_name
    dtype: text
    description: Consumer name
    nullable: true
    contains_pii: true
    pii_type: name

  - name: ssn_last4
    dtype: categorical
    description: Last 4 digits of SSN
    nullable: true
    contains_pii: true
    pii_type: ssn_last4

  - name: phone
    dtype: categorical
    description: Primary phone number
    nullable: true
    contains_pii: true
    pii_type: phone

  - name: email
    dtype: categorical
    description: Email address
    nullable: true
    contains_pii: true
    pii_type: email

  # --- Account Features ---
  - name: balance
    dtype: numeric
    description: Current outstanding balance
    nullable: false
    min_value: 0.01
    max_value: 100000.0
    feature_group: account

  - name: original_balance
    dtype: numeric
    description: Original debt amount
    nullable: false
    min_value: 0.01
    max_value: 100000.0
    feature_group: account

  - name: days_overdue
    dtype: numeric
    description: Days since payment due
    nullable: false
    min_value: 0
    max_value: 3650
    feature_group: account

  - name: account_type
    dtype: categorical
    description: Type of account
    nullable: false
    allowed_values:
      - bnpl
      - credit_card
      - personal_loan
      - subscription
      - other
    feature_group: account

  - name: original_creditor
    dtype: categorical
    description: Original creditor name
    nullable: false
    feature_group: account

  # --- Temporal Features ---
  - name: snapshot_date
    dtype: datetime
    description: Date of data snapshot
    nullable: false
    feature_group: temporal

  - name: charge_off_date
    dtype: datetime
    description: Date account was charged off
    nullable: true
    feature_group: temporal

  - name: last_payment_date
    dtype: datetime
    description: Date of last payment
    nullable: true
    feature_group: temporal

  # --- Behavioral Features ---
  - name: contact_attempts_30d
    dtype: numeric
    description: Contact attempts in last 30 days
    nullable: false
    min_value: 0
    max_value: 100
    feature_group: behavioral

  - name: rpc_count_30d
    dtype: numeric
    description: Right party contacts in last 30 days
    nullable: false
    min_value: 0
    max_value: 30
    feature_group: behavioral

  - name: payment_count_90d
    dtype: numeric
    description: Payments made in last 90 days
    nullable: false
    min_value: 0
    max_value: 30
    feature_group: behavioral

  - name: promise_to_pay_count
    dtype: numeric
    description: Number of promises to pay
    nullable: false
    min_value: 0
    max_value: 50
    feature_group: behavioral

  # --- Geographic Features ---
  - name: debtor_state
    dtype: categorical
    description: Consumer state of residence
    nullable: true
    feature_group: geographic

  - name: debtor_zip
    dtype: categorical
    description: Consumer ZIP code (first 3 digits)
    nullable: true
    contains_pii: false
    feature_group: geographic

  # --- Model Scores ---
  - name: risk_score
    dtype: numeric
    description: Pre-computed risk score
    nullable: true
    min_value: 0.0
    max_value: 1.0
    feature_group: scores

# ============================================================================
# Label Definitions
# ============================================================================
labels:
  - name: paid_in_full_90d
    label_type: binary
    description: Whether account was paid in full within 90 days
    classes:
      - no_payment
      - paid_in_full
    positive_class: paid_in_full
    observation_window_days: 90
    definition: Balance reduced to $0 within 90 days of snapshot

  - name: any_payment_30d
    label_type: binary
    description: Whether any payment was made within 30 days
    classes:
      - no_payment
      - payment
    positive_class: payment
    observation_window_days: 30
    definition: At least one payment > $0 within 30 days

  - name: payment_amount_90d
    label_type: regression
    description: Total payment amount in 90 days
    min_value: 0.0
    max_value: 100000.0
    observation_window_days: 90
    definition: Sum of all payments within 90 day window

  - name: outcome_category
    label_type: multiclass
    description: Categorical outcome at 90 days
    classes:
      - paid_in_full
      - partial_payment
      - payment_plan
      - promise_to_pay
      - no_response
      - bankruptcy
      - dispute
      - cease_desist
    observation_window_days: 90
    definition: Primary outcome category at observation window end

# ============================================================================
# Labeling Rules Documentation
# ============================================================================
labeling_rules:
  # Payment Labels
  paid_in_full: >
    Balance reduced to $0 within observation_window_days.
    Conditions: Balance == 0 at observation end AND at least one payment received.

  partial_payment: >
    Any payment > $0 that reduces balance but does not pay in full.
    Conditions: Total payments > $0 AND final balance > $0.

  payment_plan: >
    Active payment arrangement with >= 1 payment made.
    Conditions: Active arrangement exists AND at least 1 scheduled payment completed.

  promise_to_pay: >
    Verbal/written commitment, no payment yet.
    Conditions: Documented promise AND no payment received in window.

  no_response: >
    No payment or meaningful engagement in window.
    Conditions: No payments, no plan, no promise, contacts attempted.

  # Contact Labels
  right_party_contact: >
    Verified contact with account holder.
    Conditions: Identity verified AND two-way communication occurred.

  wrong_party_contact: >
    Contact made with non-account holder.
    Conditions: Person answered AND confirmed not account holder.

  # Status Labels
  bankruptcy: >
    Consumer filed bankruptcy protection. Collection activity must cease.

  dispute: >
    Consumer disputed debt validity. Must validate per FDCPA.

  cease_desist: >
    Consumer requested no further contact. Stop all contact except legal notices.
