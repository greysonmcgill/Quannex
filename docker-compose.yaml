# Pilot-shaped stack for the Quannex collections OS.
#
# Services kept:
#   - api       FastAPI backend (quan.main:app)
#   - postgres  operational database for production-ish runs
#   - dashboard Next.js operator UI
#
# Intentionally removed for the pilot: Kafka, Zookeeper, Redis, Prometheus,
# and Grafana. The runtime does not require them, so running them here gives
# a false impression of the surface area the product actually ships with.
# Re-introduce them via their optional extras (e.g. `pip install .[cache,metrics]`)
# and purpose-specific compose files when they're genuinely needed.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://quan:quan@postgres:5432/quan
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./quan:/app/quan:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: quan
      POSTGRES_PASSWORD: quan
      POSTGRES_DB: quan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quan"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
      API_URL: http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
