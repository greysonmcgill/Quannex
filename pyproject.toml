[project]
name = "quannex-recovery"
version = "0.1.0"
description = "Collections operating system for small-balance debt portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Greyson McGill", email = "greyson@quanrecovery.com"}
]

# Runtime dependencies for the pilot collections OS.
# Only what the FastAPI app, database, dashboard, and intelligence engine
# actually import is listed here. Optional integrations (payment providers,
# metrics, caching, PostgreSQL) live in the extras below.
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "cryptography>=43.0.0",
    "python-json-logger>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
# Production PostgreSQL driver. SQLite (stdlib) is the default for local dev.
postgres = ["psycopg2-binary>=2.9.9"]

# Optional payment processor wiring.
payments = ["stripe>=7.6.0"]

# Optional caching backend.
cache = ["redis>=5.0.0"]

# Optional Prometheus metrics export.
metrics = ["prometheus-client>=0.19.0"]

# Developer tooling.
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
]

[project.scripts]
quan = "quan.cli:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["quan"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "experimental/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
