[project]
name = "quan-recovery"
version = "0.1.0"
description = "Quantum Intelligence for Micro-Debt Collection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Greyson McGill", email = "greyson@quanrecovery.com"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "ray>=2.8.0",
    "prefect>=2.14.0",
    "kafka-python>=2.0.0",
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "apache-beam>=2.52.0",
    "google-cloud-bigquery>=3.13.0",
    "google-cloud-texttospeech>=2.14.0",
    "twilio>=8.10.0",
    "sendgrid>=6.11.0",
    "stripe>=7.6.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
